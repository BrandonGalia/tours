<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Property Tours | Lujo Realty</title>
  <style>
    :root {
      --bg: #1A1A1A;
      --gold: #C4A265;
      --text: #F4F1EA;
      --muted: #C8C2B6;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: Georgia, "Times New Roman", serif;
      line-height: 1.5;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      width: min(36rem, 100%);
      margin: 0 auto;
      padding: 3.5rem 1.5rem 2.5rem;
    }

    .wordmark {
      margin: 0 0 1.75rem;
      color: var(--gold);
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: 0.82rem;
      font-weight: 600;
      letter-spacing: 0.38em;
      text-indent: 0.38em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 1rem;
      color: var(--text);
      font-size: clamp(2.1rem, 7vw, 3.25rem);
      font-weight: 500;
      letter-spacing: 0.01em;
      line-height: 1.1;
    }

    .lede {
      margin: 0;
      max-width: 34rem;
      color: var(--muted);
      font-size: 1.05rem;
    }

    .site-link {
      display: inline-block;
      margin-top: 1.75rem;
      color: var(--gold);
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: 0.92rem;
      letter-spacing: 0.04em;
      text-decoration: none;
      border-bottom: 1px solid transparent;
    }

    .site-link:hover,
    .site-link:focus-visible {
      border-bottom-color: var(--gold);
    }

    footer {
      padding: 1.25rem 1.5rem 1.75rem;
      text-align: center;
    }

    footer a {
      color: var(--gold);
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: 0.78rem;
      letter-spacing: 0.06em;
      text-decoration: none;
    }

    footer a:hover,
    footer a:focus-visible {
      text-decoration: underline;
    }

    @media (min-width: 720px) {
      main {
        padding-top: 4.5rem;
      }
    }
  </style>
</head>
<body>
  <main>
    <p class="wordmark">LUJO REALTY</p>
    <h1>Property Tours</h1>
    <p class="lede">Please use the specific tour link shared by your agent to view your personalized property tour.</p>
    <a class="site-link" href="https://austinrealty.ai">austinrealty.ai</a>
  </main>
  <footer>
    <a href="https://austinrealty.ai">Prepared by Brandon at Lujo Realty</a>
  </footer>
</body>
</html>
